name: HegoSentinel CI & Sprint 7 Real Security Verification Gates

on:
  push:
    branches: [main, master, sprint-10-production-architecture]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PINNED_SEMGREP_VERSION: "1.183.0"
  PINNED_TRIVY_VERSION: "0.76.1"

jobs:
  unit-integration-security-e2e:
    name: Unit, Integration, Security Matrix (SEC-001..014), Laravel 11, PostgreSQL 16 RLS & Next.js 15
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_DB: hegosentinel
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
        ports:
          - 54329:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d hegosentinel"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.16.0', '24.x']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install toolchain & Next.js 15 dependencies
        run: |
          npm ci --ignore-scripts
          npm ci --prefix apps/web

      - name: Build Next.js 15 App Router Frontend (S10-05)
        run: npm run build:web

      - name: Static Policy & Security Lint
        run: npm run lint

      - name: Real TypeScript Compiler (tsc --noEmit) & Runtime Schema Typecheck
        run: npm run typecheck

      - name: Verify Relative Markdown Links
        run: npm run docs:links

      - name: Setup PHP 8.3 (CLI + pdo_sqlite + pdo_pgsql) for Laravel 11 API & PostgreSQL 16 RLS
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_sqlite, pdo_pgsql, pgsql, openssl, json
          tools: composer:v2
          coverage: none

      - name: Install Laravel 11 Composer Dependencies (S10-01)
        run: composer install --working-dir=apps/api --no-interaction --no-progress --no-scripts

      - name: Run Laravel 11 API (14-Module), B1 Regression & Kernel Tests (S10-01 / S10-03)
        run: npm run test:api

      - name: Run PostgreSQL 16 Row-Level Security (RLS) & Live HTTP API E2E Suite (S10-02 / S10-04)
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: "54329"
          DB_DATABASE: hegosentinel
          DB_USERNAME: postgres
          DB_PASSWORD: postgres_ci_password
          DB_ADMIN_USERNAME: postgres
          DB_ADMIN_PASSWORD: postgres_ci_password
          REQUIRE_POSTGRES_RLS: "1"
        run: |
          npm run test:postgres-rls
          php -d extension=pdo_pgsql -d extension=pgsql apps/api/tests/run-postgres-http-e2e-tests.php

      - name: Run Unit, Integration, Security, E2E & Sprint 10 Acceptance Suites
        run: |
          npm run test:unit
          npm run test:integration
          npm run test:security
          npm run test:e2e
          node --experimental-strip-types --test ./tests/security/sprint10-acceptance-audit.test.ts

      - name: Execute Offline Synthetic Demo & Assert Zero Secret Leakage (SEC-007 / SEC-014)
        run: |
          npm run demo
          npm run verify:gates
          if grep -rn "SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c" ./reports/; then
            echo "CRITICAL: Planted JWT secret leaked into generated reports!"
            exit 1
          fi

      - name: Upload Test & Gate Reports Artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-and-gate-reports-node-${{ matrix.node-version }}
          path: |
            reports/demo-baseline.json
            reports/demo-patched.json
            reports/demo-recheck.json
            reports/demo-recheck.md
            reports/demo-recheck.html
            reports/security-gates-verification.json
            reports/security-gates-verification.md

  docker-worker-containment:
    name: Real Docker Worker Containment Verification (WKR-001..005)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.16.0
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build Worker Image & Verify Real Container Isolation (WKR-001..005)
        run: bash ./scripts/linux-docker-verify.sh

      - name: Upload Docker Containment Evidence Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-docker-evidence
          path: reports/linux-docker-evidence.json

  real-scanners-semgrep-trivy:
    name: Real Pinned Semgrep CE (1.183.0) & Trivy (0.76.1) Verification (CODE-001 & DEP-001)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.16.0
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Pinned Semgrep CE (${{ env.PINNED_SEMGREP_VERSION }}) & Trivy (${{ env.PINNED_TRIVY_VERSION }})
        run: |
          python3 -m pip install --break-system-packages --no-cache-dir "semgrep==${PINNED_SEMGREP_VERSION}"
          curl -sfL "https://github.com/aquasecurity/trivy/releases/download/v${PINNED_TRIVY_VERSION}/trivy_${PINNED_TRIVY_VERSION}_Linux-64bit.tar.gz" | sudo tar -xz -C /usr/local/bin trivy
          semgrep --version
          trivy --version
          trivy image --download-db-only

      - name: Verify Real Semgrep & Trivy Execution on Synthetic Laravel, Next.js & Node.js Targets
        run: bash ./scripts/linux-scanner-verify.sh

      - name: Upload Real Scanner Evidence Artifact
        uses: actions/upload-artifact@v4
        with:
          name: real-scanner-evidence
          path: reports/real-scanner-evidence.json

  real-egress-broker-isolation:
    name: Real Linux Network Isolation & Trusted Egress Broker Verification (EGR-001..006)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.16.0
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build Worker Image & Verify Isolated Network + Trusted Egress Broker (EGR-001..006)
        run: |
          docker build -t hegosentinel-worker:0.1.0-alpha.4 -f ./apps/worker/Dockerfile .
          bash ./scripts/linux-netns-egress-verify.sh

      - name: Upload Linux Egress Isolation Evidence Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-egress-isolation-evidence
          path: reports/linux-egress-isolation-evidence.json

  sprint10-docker-compose-integration:
    name: Sprint 10 Full 8-Service Docker Compose & Disposable Worker Emergency Stop (S10-07)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.16.0
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Build & Verify 8-Service Docker Compose Stack, E2E Scan & <2000ms Container Kill
        run: bash ./scripts/linux-sprint10-compose-verify.sh

      - name: Upload Sprint 10 Docker Compose Evidence Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sprint10-compose-evidence
          path: reports/sprint10-compose-evidence.json

  secret-and-dependency-security:
    name: Secret Scanning (Gitleaks + Trivy Secret) & Dependency Security Audit
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22.16.0
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Install dependencies & Run npm audit
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high

      - name: Install Gitleaks & Trivy (${{ env.PINNED_TRIVY_VERSION }}) and Scan Repository for Secrets
        run: |
          curl -sfL "https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz" | sudo tar -xz -C /usr/local/bin gitleaks
          curl -sfL "https://github.com/aquasecurity/trivy/releases/download/v${PINNED_TRIVY_VERSION}/trivy_${PINNED_TRIVY_VERSION}_Linux-64bit.tar.gz" | sudo tar -xz -C /usr/local/bin trivy
          mkdir -p reports
          gitleaks version
          cat > /tmp/gitleaks-ci.toml << 'EOF'
          [extend]
          useDefault = true
          [allowlist]
          description = "Synthetic security redaction test fixtures only"
          paths = [
            '''^examples/''',
            '''^tests/''',
            '''^apps/api/tests/''',
            '''^docs/audit-evidence/'''
          ]
          EOF
          gitleaks git . --config /tmp/gitleaks-ci.toml --no-banner --redact --report-format json --report-path reports/gitleaks-git-secrets.json
          trivy fs --scanners secret --skip-dirs ".tools,examples,tests,apps/api/tests,docs/audit-evidence" --exit-code 1 --format json --output reports/trivy-repo-secrets.json .

      - name: Upload Secret & Dependency Audit Artifact
        uses: actions/upload-artifact@v4
        with:
          name: secret-and-dependency-audit
          path: |
            reports/gitleaks-git-secrets.json
            reports/trivy-repo-secrets.json

  production-release-gate:
    name: Production Release Gate Enforcement (Zero FAIL & Zero SKIP Required)
    runs-on: ubuntu-24.04
    needs:
      - unit-integration-security-e2e
      - docker-worker-containment
      - real-scanners-semgrep-trivy
      - real-egress-broker-isolation
      - sprint10-docker-compose-integration
      - secret-and-dependency-security
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.16.0
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Install dependencies & Pinned Scanners
        run: |
          npm ci --ignore-scripts
          python3 -m pip install --break-system-packages --no-cache-dir "semgrep==${PINNED_SEMGREP_VERSION}"
          curl -sfL "https://github.com/aquasecurity/trivy/releases/download/v${PINNED_TRIVY_VERSION}/trivy_${PINNED_TRIVY_VERSION}_Linux-64bit.tar.gz" | sudo tar -xz -C /usr/local/bin trivy
          trivy image --download-db-only

      - name: Download Verification Evidence Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./reports
          merge-multiple: true

      - name: Enforce Zero FAIL & Zero SKIP Production Release Gate
        run: |
          npm run verify:gates
          npm run verify:release-gate -- --enforce-production-release

      - name: Upload Final Unified Release Gate Report
        uses: actions/upload-artifact@v4
        with:
          name: final-release-gate-verification
          path: |
            reports/security-gates-verification.json
            reports/security-gates-verification.md
            reports/linux-docker-evidence.json
            reports/real-scanner-evidence.json
            reports/linux-egress-isolation-evidence.json
            reports/sprint10-compose-evidence.json
